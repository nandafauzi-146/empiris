<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="heroDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>

  <!-- Heritage Architecture Silhouette (Surakarta Keraton Tower / Panggung Sangga Buwana) -->
  <g fill="#1E293B" opacity="0.6">
    <!-- Main Center Tower -->
    <rect x="740" y="240" width="120" height="300" rx="4"/>
    <path d="M 720 240 L 800 150 L 880 240 Z"/>
    <rect x="780" y="100" width="40" height="50"/>
    <path d="M 770 100 L 800 60 L 830 100 Z"/>
    <!-- Windows & Arches -->
    <rect x="760" y="270" width="30" height="50" rx="15" fill="#475569"/>
    <rect x="810" y="270" width="30" height="50" rx="15" fill="#475569"/>
    <rect x="760" y="350" width="30" height="60" rx="15" fill="#475569"/>
    <rect x="810" y="350" width="30" height="60" rx="15" fill="#475569"/>
  </g>

  <!-- Wide Heritage Gate / Pavilion -->
  <g fill="#334155" opacity="0.8">
    <rect x="300" y="440" width="1000" height="160"/>
    <!-- Grand Arches with Red & White Drapes/Bunting -->
    <path d="M 320 600 Q 400 480 480 600" stroke="#E2E8F0" stroke-width="8" fill="none"/>
    <path d="M 520 600 Q 600 480 680 600" stroke="#E2E8F0" stroke-width="8" fill="none"/>
    <path d="M 720 600 Q 800 460 880 600" stroke="#E2E8F0" stroke-width="12" fill="none"/>
    <path d="M 920 600 Q 1000 480 1080 600" stroke="#E2E8F0" stroke-width="8" fill="none"/>
    <path d="M 1120 600 Q 1200 480 1280 600" stroke="#E2E8F0" stroke-width="8" fill="none"/>
    
    <!-- Red Festoon Drapes along arches (matching the photo in Figma) -->
    <path d="M 300 460 Q 400 500 500 460 T 700 460 T 900 460 T 1100 460 T 1300 460" stroke="#DC2626" stroke-width="14" fill="none"/>
    <path d="M 300 475 Q 400 515 500 475 T 700 475 T 900 475 T 1100 475 T 1300 475" stroke="#FFFFFF" stroke-width="6" fill="none"/>
  </g>

  <!-- Ground Plaza -->
  <rect x="0" y="600" width="1600" height="400" fill="#1E293B" opacity="0.9"/>
  
  <!-- Subtle Becak / Pedicab in red -->
  <g transform="translate(820, 680)" opacity="0.7">
    <circle cx="30" cy="50" r="24" stroke="#DC2626" stroke-width="4" fill="none"/>
    <circle cx="90" cy="50" r="24" stroke="#DC2626" stroke-width="4" fill="none"/>
    <path d="M 30 50 L 60 20 L 90 50" stroke="#DC2626" stroke-width="4" fill="none"/>
    <path d="M 20 25 L 70 25 L 60 45 L 20 45 Z" fill="#DC2626"/>
  </g>

  <!-- Full Overlay -->
  <rect width="1600" height="1000" fill="url(#heroDark)"/>
</svg>
