<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none" width="160" height="44">
  <!-- Pill Background -->
  <rect width="160" height="44" rx="22" fill="#D32F2F"/>
  
  <!-- Left Soundwaves / Broadcast Arcs -->
