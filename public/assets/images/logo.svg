    <path d="M 21 13 A 13 13 0 0 0 21 31"/>
    <path d="M 26 10 A 17 17 0 0 0 26 34"/>
  </g>
  <circle cx="12" cy="22" r="2" fill="#FFFFFF"/>

  <!-- Brand Typography -->
