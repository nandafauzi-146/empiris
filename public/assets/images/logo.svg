  <!-- JALAN - JALAN -->
  <text x="80" y="32" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" letter-spacing="2.5" text-anchor="middle">JALAN - JALAN</text>

  <!-- Right Soundwaves / Broadcast Arcs -->
